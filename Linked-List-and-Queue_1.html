leg:['cur walks the list · prev is one node behind cur · temp is the new or removed node · dashed = freed · red arrow = prev link not fixed yet','cur = ಸಂಚರಿಸುವ pointer · prev = cur ನ ಹಿಂದಿನದು · temp = ಹೊಸ/ತೆಗೆಯುವ node · ಡ್ಯಾಶ್ = free ಆಗಿದೆ · ಕೆಂಪು ಬಾಣ = prev link ಇನ್ನೂ ಸರಿಯಾಗಿಲ್ಲ'],

nn:['Type a number in the box first.','ಮೊದಲು ಬಾಕ್ಸ್‌ನಲ್ಲಿ ಸಂಖ್ಯೆ ಟೈಪ್ ಮಾಡಿ.'],cpd:['Program copied.','ಪ್ರೋಗ್ರಾಂ ನಕಲಾಯಿತು.'],cpf:['Press and hold the code to select and copy it.','ಕೋಡ್ ಅನ್ನು ಒತ್ತಿ ಹಿಡಿದು ಆಯ್ಕೆಮಾಡಿ ನಕಲಿಸಿ.'],
gt:['Tap the line that comes next. Braces are free.','ಮುಂದಿನ ಸಾಲನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ. { } ಉಚಿತ.'],gw:['Not yet. What must happen before that line?','ಇನ್ನೂ ಸರಿಯಲ್ಲ. ಈ ಸಾಲಿನ ಮೊದಲು ಏನು ನಡೆಯಬೇಕು?'],gd:['🎉 Perfect! Now tick “Hide code” and write this function on paper.','🎉 ಅದ್ಭುತ! ಈಗ “ಕೋಡ್ ಮರೆಮಾಡಿ” ಆಯ್ಕೆಮಾಡಿ, ಪುಸ್ತಕದಲ್ಲಿ ಬರೆಯಿರಿ.'],
G:[['Lab programs','ಲ್ಯಾಬ್ ಪ್ರೋಗ್ರಾಂಗಳು'],['Singly list, stack, queue','Singly list, stack, queue'],['Header node (singly)','Header node (singly)'],['Doubly lists','Doubly lists'],['Queue in an array','Array queue']]
};
const OL={cr:['Create (front ×3)','ರಚಿಸಿ (front ×3)'],iF:['Insert front','ಮುಂದೆ ಸೇರಿಸಿ'],iE:['Insert rear','ಕೊನೆಗೆ ಸೇರಿಸಿ'],dF:['Delete front','ಮುಂದಿನಿಂದ ಅಳಿಸಿ'],dE:['Delete rear','ಕೊನೆಯಿಂದ ಅಳಿಸಿ'],iR:['Insert right of key','key ಬಲಕ್ಕೆ ಸೇರಿಸಿ'],dR:['Delete right of key','key ಬಲದ node ಅಳಿಸಿ'],dsp:['Display','ಪ್ರದರ್ಶಿಸಿ'],len:['Count nodes','node ಎಣಿಸಿ'],srch:['Search','ಹುಡುಕಿ'],dinfo:['Delete by info','info ಇಂದ ಅಳಿಸಿ'],cat:['Concatenate','ಜೋಡಿಸಿ (concat)'],rev:['Reverse','ಹಿಮ್ಮುಖ ಮಾಡಿ'],place:['Sorted insert','ಕ್ರಮವಾಗಿ ಸೇರಿಸಿ'],iP:['Insert at position','position ನಲ್ಲಿ ಸೇರಿಸಿ'],dP:['Delete at position','position ನಿಂದ ಅಳಿಸಿ'],qi:['Insert','ಸೇರಿಸಿ'],qd:['Delete','ಅಳಿಸಿ'],qs:['Display','ಪ್ರದರ್ಶಿಸಿ']};
const OI={
cr:['Create: call insert_front n times. The first item ends up last, so inserting 10, 20, 30 gives 30 → 20 → 10.','Create: insert_front ಅನ್ನು n ಬಾರಿ ಕರೆಯಿರಿ. 10, 20, 30 ಸೇರಿಸಿದರೆ 30 → 20 → 10 ಆಗುತ್ತದೆ.'],
iF:['Insert front: make temp, set info, point temp’s link at the old first, then first becomes temp (return temp). Works on an empty list too. O(1).','Insert front: temp ರಚಿಸಿ, info ಇಡಿ, temp ನ link ಹಳೆಯ first ಗೆ ತೋರಿಸಿ, ನಂತರ first = temp (return temp). ಖಾಲಿ list ಗೂ ಕೆಲಸ ಮಾಡುತ್ತದೆ. O(1).'],
iE:['Insert rear: walk cur to the last node, then attach temp after it. If the list is empty temp itself is returned (circular lists connect temp back to the start). O(n).','Insert rear: cur ಅನ್ನು ಕೊನೆಯ node ವರೆಗೆ ಒಯ್ದು ಅದರ ನಂತರ temp ಜೋಡಿಸಿ. list ಖಾಲಿ ಇದ್ದರೆ temp ಅನ್ನೇ return ಮಾಡಿ (circular ನಲ್ಲಿ temp ಅನ್ನು ಆರಂಭಕ್ಕೆ ಜೋಡಿಸಿ). O(n).'],
dF:['Delete front: check empty first, remember the first node, move first forward, print the item, then free the old node.','Delete front: ಮೊದಲು ಖಾಲಿ ಪರೀಕ್ಷಿಸಿ, ಮೊದಲ node ನೆನಪಿಡಿ, first ಅನ್ನು ಮುಂದೆ ಸರಿಸಿ, item ಮುದ್ರಿಸಿ, ಹಳೆಯ node ಅನ್ನು free ಮಾಡಿ.'],
dE:['Delete rear: three cases: empty, only one node, more than one. Keep prev one step behind cur so prev becomes the new last node, then free cur.','Delete rear: 3 ಸಂದರ್ಭ: ಖಾಲಿ, ಒಂದೇ node, ಹೆಚ್ಚು node. prev ಅನ್ನು cur ನ ಹಿಂದೆ ಇಡಿ; prev ಹೊಸ ಕೊನೆಯ node ಆಗುತ್ತದೆ; ನಂತರ cur ಅನ್ನು free ಮಾಡಿ.'],
dsp:['Display: if empty print a message; otherwise start cur at the first node and print cur->info while moving cur to the next node.','Display: ಖಾಲಿ ಇದ್ದರೆ ಸಂದೇಶ; ಇಲ್ಲದಿದ್ದರೆ cur ಅನ್ನು ಮೊದಲ node ನಿಂದ ಶುರುಮಾಡಿ cur->info ಮುದ್ರಿಸುತ್ತಾ ಮುಂದಿನ node ಗೆ ಸರಿಸಿ.'],
len:['Length: walk cur from first and count every node until NULL.','Length: cur ಅನ್ನು first ನಿಂದ NULL ವರೆಗೆ ಸರಿಸುತ್ತಾ ಪ್ರತಿ node ಎಣಿಸಿ.'],
srch:['Search: walk cur, compare item with cur->info and count pos. Stop when found or when cur becomes NULL. (Your notes print pos - 1; with pos starting at 1 the position is pos.)','Search: cur ಸರಿಸುತ್ತಾ item ಅನ್ನು cur->info ಜೊತೆ ಹೋಲಿಸಿ, pos ಎಣಿಸಿ. ಸಿಕ್ಕಾಗ ಅಥವಾ cur NULL ಆದಾಗ ನಿಲ್ಲಿಸಿ. (pos 1 ರಿಂದ ಶುರುವಾದರೆ ಸ್ಥಾನ = pos.)'],
dinfo:['Delete by info: if key is in the first node move first; otherwise walk with prev and cur, then prev->link = cur->link and free cur.','Delete by info: key ಮೊದಲ node ನಲ್ಲಿದ್ದರೆ first ಸರಿಸಿ; ಇಲ್ಲದಿದ್ದರೆ prev, cur ಜೊತೆ ಹುಡುಕಿ prev->link = cur->link ಮಾಡಿ cur ಅನ್ನು free ಮಾಡಿ.'],
cat:['Concatenate: attach list sec after the last node of first (the second list is 70 → 80 here). If first is empty return sec.','Concatenate: first ನ ಕೊನೆಯ node ನಂತರ sec list ಜೋಡಿಸಿ (ಇಲ್ಲಿ ಎರಡನೇ list 70 → 80). first ಖಾಲಿ ಇದ್ದರೆ sec return.'],
rev:['Reverse without new nodes: cur is the reversed part. Each round: temp = first->link, first->link = cur, then cur and first move ahead.','ಹೊಸ node ಇಲ್ಲದೆ reverse: cur = ಹಿಮ್ಮುಖವಾದ ಭಾಗ. ಪ್ರತಿ ಸುತ್ತಿನಲ್ಲಿ temp = first->link, first->link = cur, ನಂತರ cur ಮತ್ತು first ಮುಂದೆ ಸರಿಸಿ.'],
iR:['Insert right of key: find the node whose info is key (cur), then temp->link = cur->link and cur->link = temp. The order of these two lines matters. In doubly lists also fix the llink of both new neighbours.','Key ನ ಬಲಕ್ಕೆ ಸೇರಿಸಿ: info = key ಇರುವ node (cur) ಹುಡುಕಿ, ನಂತರ temp->link = cur->link, cur->link = temp (ಈ ಎರಡರ ಕ್ರಮ ಮುಖ್ಯ). Doubly ನಲ್ಲಿ ಎರಡೂ ಕಡೆ llink ಕೂಡ ಸರಿಪಡಿಸಿ.'],
dR:['Delete right of key: find cur with info == key, take temp = cur->link, bypass it with cur->link = temp->link, then free temp. In circular lists the node to the right of the last node is the first node.','Key ನ ಬಲದ node ಅಳಿಸಿ: info == key ಇರುವ cur ಹುಡುಕಿ, temp = cur->link, cur->link = temp->link ಮಾಡಿ ಬಿಟ್ಟುಹೋಗಿ, temp ಅನ್ನು free ಮಾಡಿ. Circular ನಲ್ಲಿ ಕೊನೆಯ node ನ ಬಲ = ಮೊದಲ node.'],
place:['Sorted insert (place): keep the list in ascending order: find the first node not smaller than item, then link temp between prev and cur.','Sorted insert (place): list ಏರುಕ್ರಮದಲ್ಲಿ ಉಳಿಯುವಂತೆ: item ಗಿಂತ ಚಿಕ್ಕದಲ್ಲದ ಮೊದಲ node ಹುಡುಕಿ, prev ಮತ್ತು cur ನಡುವೆ temp ಜೋಡಿಸಿ.'],
iP:['Insert at position: walk prev and cur to the position, then prev->link = temp and temp->link = cur. Position 1 is the front.','Position ನಲ್ಲಿ ಸೇರಿಸಿ: prev, cur ಅನ್ನು position ವರೆಗೆ ಸರಿಸಿ, prev->link = temp, temp->link = cur. Position 1 = ಮುಂಭಾಗ.'],
dP:['Delete at position: walk prev and cur to that position, then prev->link = cur->link and free cur.','Position ನಿಂದ ಅಳಿಸಿ: prev, cur ಅನ್ನು ಆ position ವರೆಗೆ ಸರಿಸಿ, prev->link = cur->link, cur ಅನ್ನು free ಮಾಡಿ.'],
qi:['Insert (enqueue): check overflow first, then move rear and store the item at data[rear]. In the circular queue rear = (rear + 1) % MAX wraps around.','Insert (enqueue): ಮೊದಲು overflow ಪರೀಕ್ಷಿಸಿ, ನಂತರ rear ಸರಿಸಿ data[rear] ನಲ್ಲಿ item ಇಡಿ. Circular queue ನಲ್ಲಿ rear = (rear + 1) % MAX ಸುತ್ತುತ್ತದೆ.'],
qd:['Delete (dequeue): check underflow first, then print data[front] and move front forward.','Delete (dequeue): ಮೊದಲು underflow ಪರೀಕ್ಷಿಸಿ, data[front] ಮುದ್ರಿಸಿ, front ಮುಂದೆ ಸರಿಸಿ.'],
qs:['Display: if empty print a message; otherwise print the elements from front to rear.','Display: ಖಾಲಿ ಇದ್ದರೆ ಸಂದೇಶ; ಇಲ್ಲದಿದ್ದರೆ front ನಿಂದ rear ವರೆಗೆ ಮುದ್ರಿಸಿ.']};
const FI={
S:['Singly linked list: each node has info (data) and link (address of the next node). first points to the first node; the last node’s link is NULL.','Singly linked list: ಪ್ರತಿ node ನಲ್ಲಿ info (ಡೇಟಾ) ಮತ್ತು link (ಮುಂದಿನ node ವಿಳಾಸ) ಇರುತ್ತದೆ. first ಮೊದಲ node ಅನ್ನು ತೋರಿಸುತ್ತದೆ; ಕೊನೆಯ node ನ link NULL.'],
C:['Circular singly list with a last pointer: last->link is the first node, so the list is a ring. Insert at front or rear needs no loop. Empty list: last = NULL.','Circular singly list (last pointer): last->link ಮೊದಲ node, ಆದ್ದರಿಂದ list ಉಂಗುರ. ಮುಂದೆ/ಕೊನೆಗೆ ಸೇರಿಸಲು loop ಬೇಡ. ಖಾಲಿ list: last = NULL.'],
H:['Header node: an extra first node (head) that holds no data, so the real list starts at head->link. Empty list: head->link == NULL, so the front never needs a special case.','Header node: ಡೇಟಾ ಇಲ್ಲದ ಹೆಚ್ಚುವರಿ ಮೊದಲ node (head); ನಿಜವಾದ list head->link ನಿಂದ ಶುರು. ಖಾಲಿ list: head->link == NULL; ಮುಂಭಾಗಕ್ಕೆ ವಿಶೇಷ ಸಂದರ್ಭ ಬೇಡ.'],
HC:['Circular list with header: the last node links back to head. Empty list: head->link == head, so loops stop at head instead of NULL.','Header ಸಹಿತ circular list: ಕೊನೆಯ node head ಗೆ ಹಿಂದಿರುಗುತ್ತದೆ. ಖಾಲಿ list: head->link == head; loop NULL ಬದಲು head ನಲ್ಲಿ ನಿಲ್ಲುತ್ತದೆ.'],
D:['Doubly linked list: each node has llink (previous), info and rlink (next). The first node’s llink and the last node’s rlink are NULL. Every change must fix both links.','Doubly linked list: ಪ್ರತಿ node ನಲ್ಲಿ llink (ಹಿಂದಿನದು), info, rlink (ಮುಂದಿನದು). ಮೊದಲ node ನ llink ಮತ್ತು ಕೊನೆಯ node ನ rlink NULL. ಪ್ರತಿ ಬದಲಾವಣೆಯಲ್ಲಿ ಎರಡೂ link ಸರಿಪಡಿಸಿ.'],
CD:['Circular doubly list: last->rlink is first and first->llink is last, so last = first->llink. There is no NULL anywhere.','Circular doubly list: last->rlink = first, first->llink = last; ಆದ್ದರಿಂದ last = first->llink. NULL ಎಲ್ಲೂ ಇಲ್ಲ.'],
DH:['Doubly list with header: head holds no data; head->rlink is the first real node and its llink points back to head.','Header ಸಹಿತ doubly list: head ಡೇಟಾ ಇಲ್ಲದ node; head->rlink ಮೊದಲ ನಿಜ node, ಅದರ llink head ಗೆ ತೋರಿಸುತ್ತದೆ.'],
CDH:['Circular doubly list with header: head->rlink is the first node, head->llink is the last node, and both ends connect back to head.','Header ಸಹಿತ circular doubly list: head->rlink ಮೊದಲ node, head->llink ಕೊನೆಯ node; ಎರಡೂ ತುದಿ head ಗೆ ಸೇರುತ್ತವೆ.'],
QC:['Circular queue in an array: rear = (rear + 1) % MAX wraps around; count == MAX means full (overflow), count == 0 means empty (underflow).','Array ನಲ್ಲಿ circular queue: rear = (rear + 1) % MAX ಸುತ್ತುತ್ತದೆ; count == MAX ತುಂಬಿದೆ (overflow), count == 0 ಖಾಲಿ (underflow).'],
QL:['Linear queue in an array: rear only moves forward, so freed cells at the front are never reused (overflow even when front cells are free).','Array ನಲ್ಲಿ linear queue: rear ಮುಂದೆ ಮಾತ್ರ ಹೋಗುತ್ತದೆ, ಮುಂಭಾಗದ ಖಾಲಿ ಜಾಗ ಮರುಬಳಕೆ ಆಗುವುದಿಲ್ಲ (ಮುಂದೆ ಖಾಲಿ ಇದ್ದರೂ overflow).']};
const XI={stk:['Stack (LIFO): push = insert_front and pop = delete_front, so the top is first. Both are O(1).','Stack (LIFO): push = insert_front, pop = delete_front; top = first. ಎರಡೂ O(1).'],que:['Queue (FIFO): enqueue = insert_rear (at the end), dequeue = delete_front (from the front).','Queue (FIFO): enqueue = insert_rear (ಕೊನೆಗೆ), dequeue = delete_front (ಮುಂದಿನಿಂದ).'],deq:['Double-ended queue: insert and delete are allowed at both the front and the rear.','Double-ended queue: ಮುಂದೆ ಮತ್ತು ಕೊನೆ ಎರಡೂ ಕಡೆ ಸೇರಿಸಬಹುದು/ಅಳಿಸಬಹುದು.']};

const EM=(c,r,m)=>`    if (${c})\n    {\n        printf("${m||'List is empty'}\\n");\n        return${r?' '+r:''};\n    }\n`;

const CN=m=>`NODE createNode()\n{\n    NODE newnode;\n    newnode = (NODE)malloc(sizeof(struct node));\n    if (newnode == NULL)\n    {\n        printf("Memory allocation failed\\n");\n        exit(0);\n    }\n    return newnode;\n}`;
const PS='#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int info;\n    struct node *link;\n};\ntypedef struct node *NODE;\n\n'+CN();
const PD='#include <stdio.h>\n#include <stdlib.h>\n\nstruct node\n{\n    int info;\n    struct node *llink;\n    struct node *rlink;\n};\ntypedef struct node *NODE;\n\n'+CN();
const BN={iF:'insert_front',iE:'insert_rear',dF:'delete_front',dE:'delete_rear',dsp:'display',len:'length',srch:'search',dinfo:'delete_info',cat:'concat',rev:'reverse',iR:'insert_right',dR:'delete_right',place:'place',iP:'insert_pos',dP:'delete_pos'};

dF:`NODE ${N.dF}(NODE first)\n{\n    NODE temp;\n${EM('first == NULL','NULL')}    temp = first;\n    temp = temp->link;\n${PI('first')}    free(first);\n    return temp;\n}`,
dE:`NODE ${N.dE}(NODE first)\n{\n    NODE prev, cur;\n${EM('first == NULL','NULL')}    if (first->link == NULL)\n    {\n${PI('first','        ')}        free(first);\n        return NULL;\n    }\n    prev = NULL;\n    cur = first;\n    while (cur->link != NULL)\n    {\n        prev = cur;\n        cur = cur->link;\n    }\n${PI('cur')}    free(cur);\n    prev->link = NULL;\n    return first;\n}`,
dsp:`void ${N.dsp}(NODE first)\n{\n    NODE cur;\n${EM('first == NULL','')}    printf("The contents of the list are:\\n");\n    cur = first;\n    while (cur != NULL)\n    {\n        printf("Item %d\\n", cur->info);\n        cur = cur->link;\n    }\n}`,
len:`int ${N.len}(NODE first)\n{\n    NODE cur;\n    int ecount = 0;\n    if (first == NULL)\n        return 0;\n    cur = first;\n    while (cur != NULL)\n    {\n        ecount++;\n        cur = cur->link;\n    }\n    return ecount;\n}`,
srch:`void ${N.srch}(int item, NODE first)\n{\n    NODE cur;\n    int pos;\n${EM('first == NULL','')}    cur = first;\n    pos = 1;\n    while (cur != NULL && item != cur->info)\n    {\n        cur = cur->link;\n        pos++;\n    }\n    if (cur == NULL)\n    {\n        printf("Search unsuccessful\\n");\n        return;\n    }\n    printf("Search successful\\n");\n    printf("Item found at position %d\\n", pos);\n}`,
dinfo:`NODE ${N.dinfo}(int key, NODE first)\n{\n    NODE prev, cur;\n${EM('first == NULL','NULL')}    if (key == first->info)\n    {\n        cur = first;\n        first = first->link;\n        free(cur);\n        return first;\n    }\n    prev = NULL;\n    cur = first;\n    while (cur != NULL)\n    {\n        if (key == cur->info)\n            break;\n        prev = cur;\n        cur = cur->link;\n    }\n${EM('cur == NULL','first','Search is unsuccessful')}    prev->link = cur->link;\n    free(cur);\n    return first;\n}`,
cat:`NODE ${N.cat}(NODE first, NODE sec)\n{\n    NODE cur;\n    if (first == NULL)\n        return sec;\n    if (sec == NULL)\n        return first;\n    cur = first;\n    while (cur->link != NULL)\n    {\n        cur = cur->link;\n    }\n    cur->link = sec;\n    return first;\n}`,
rev:`NODE ${N.rev}(NODE first)\n{\n    NODE cur, temp;\n    cur = NULL;\n    while (first != NULL)\n    {\n        temp = first->link;\n        first->link = cur;\n        cur = first;\n        first = temp;\n    }\n    return cur;\n}`,
iR:`NODE ${N.iR}(int item, int key, NODE first)\n{\n    NODE temp, cur;\n    cur = first;\n    while (cur != NULL && cur->info != key)\n        cur = cur->link;\n${EM('cur == NULL','first','Key not found')}${GN}    temp->link = cur->link;\n    cur->link = temp;\n    return first;\n}`,
dR:`NODE ${N.dR}(int key, NODE first)\n{\n    NODE temp, cur;\n    cur = first;\n    while (cur != NULL && cur->info != key)\n        cur = cur->link;\n${EM('cur == NULL || cur->link == NULL','first','Cannot delete')}    temp = cur->link;\n    cur->link = temp->link;\n${PI('temp')}    free(temp);\n    return first;\n}`,
place:`NODE ${N.place}(int item, NODE first)\n{\n    NODE temp, cur, prev;\n${GN}    temp->link = NULL;\n    if (first == NULL)\n        return temp;\n    if (item < first->info)\n    {\n        temp->link = first;\n        return temp;\n    }\n    prev = NULL;\n    cur = first;\n    while (cur != NULL && item >= cur->info)\n    {\n        prev = cur;\n        cur = cur->link;\n    }\n    prev->link = temp;\n    temp->link = cur;\n    return first;\n}`,
iP:`NODE ${N.iP}(int item, int pos, NODE first)\n{\n    NODE temp, cur, prev;\n    int i;\n${GN}    if (pos == 1)\n    {\n        temp->link = first;\n        return temp;\n    }\n    prev = NULL;\n    cur = first;\n    i = 1;\n    while (cur != NULL && i < pos)\n    {\n        prev = cur;\n        cur = cur->link;\n        i++;\n    }\n    if (i < pos)\n    {\n        printf("Invalid position\\n");\n        free(temp);\n        return first;\n    }\n    prev->link = temp;\n    temp->link = cur;\n    return first;\n}`,
dP:`NODE ${N.dP}(int pos, NODE first)\n{\n    NODE cur, prev;\n    int i;\n${EM('first == NULL','NULL')}    if (pos == 1)\n    {\n        cur = first;\n        first = first->link;\n${PI('cur','        ')}        free(cur);\n        return first;\n    }\n    prev = NULL;\n    cur = first;\n    i = 1;\n    while (cur != NULL && i < pos)\n    {\n        prev = cur;\n        cur = cur->link;\n        i++;\n    }\n${EM('cur == NULL','first','Invalid position')}    prev->link = cur->link;\n${PI('cur')}    free(cur);\n    return first;\n}`});
const CL=N=>({
iF:`NODE ${N.iF}(int item, NODE last)\n{\n    NODE temp;\n${GN}    if (last == NULL)\n        last = temp;\n    else\n        temp->link = last->link;\n    last->link = temp;\n    return last;\n}`,

dR:`NODE ${N.dR}(NODE last)\n{\n    NODE cur, temp;\n    int key;\n${EM('last == NULL','NULL')}    printf("Enter the node value: ");\n    scanf("%d", &key);\n    cur = last->link;\n    while (cur->info != key && cur != last)\n    {\n        cur = cur->link;\n    }\n${EM('cur->info != key','last','Node not found')}    temp = cur->link;\n    if (temp == cur)\n    {\n        free(temp);\n        return NULL;\n    }\n    cur->link = temp->link;\n    if (temp == last)\n        last = cur;\n${PI('temp')}    free(temp);\n    return last;\n}`,
dsp:`void ${N.dsp}(NODE last)\n{\n    NODE temp;\n${EM('last == NULL','')}    printf("The contents of the list are:\\n");\n    temp = last->link;\n    while (temp != last)\n    {\n        printf("Item %d\\n", temp->info);\n        temp = temp->link;\n    }\n    printf("Item %d\\n", temp->info);\n}`,
dF:`NODE ${N.dF}(NODE last)\n{\n    NODE first;\n${EM('last == NULL','NULL')}    if (last->link == last)\n    {\n${PI('last','        ')}        free(last);\n        return NULL;\n    }\n    first = last->link;\n    last->link = first->link;\n${PI('first')}    free(first);\n    return last;\n}`});
const HL=(N,c)=>{const T=c?'head':'NULL';return{

const DL=N=>({

dE:`NODE ${N.dE}(NODE first)\n{\n    NODE cur, prev;\n${EM('first == NULL','NULL')}    if (first->rlink == NULL)\n    {\n${PI('first','        ')}        free(first);\n        return NULL;\n    }\n    prev = NULL;\n    cur = first;\n    while (cur->rlink != NULL)\n    {\n        prev = cur;\n        cur = cur->rlink;\n    }\n${PI('cur')}    free(cur);\n    prev->rlink = NULL;\n    return first;\n}`,

const CDL=N=>({

 const mul=lvl(['*','%','/'],un),add=lvl(['+','-'],mul),rel=lvl(['<','>','<=','>='],add),eq=lvl(['==','!='],rel),and=lvl(['&&'],eq),or=lvl(['||'],and);

const BB=[
['What is a node?','Node ಎಂದರೇನು?','A node is a struct with a data part (info) and a pointer part (link) that holds the address of the next node. It points to its own type, so it is a self-referential structure: struct node { int info; struct node *link; };','Node ಎಂದರೆ ಡೇಟಾ (info) ಮತ್ತು ಮುಂದಿನ node ನ ವಿಳಾಸ ಹಿಡಿಯುವ pointer (link) ಇರುವ struct. ತನ್ನದೇ ಪ್ರಕಾರವನ್ನು ತೋರಿಸುವುದರಿಂದ ಇದು self-referential structure: struct node { int info; struct node *link; };','l'],
['Why typedef struct node *NODE?','typedef struct node *NODE ಏಕೆ?','typedef gives a short name: NODE means “pointer to struct node”, so we write NODE first; instead of struct node *first;','typedef ಚಿಕ್ಕ ಹೆಸರು ಕೊಡುತ್ತದೆ: NODE = “struct node ಗೆ pointer”. ಆದ್ದರಿಂದ struct node *first; ಬದಲು NODE first; ಎಂದು ಬರೆಯುತ್ತೇವೆ.','l'],
['Why createNode()?','createNode() ಏಕೆ?','Every new node needs memory. malloc gives memory from the heap and returns its address; we check for NULL (no memory left) and exit. createNode() hides this so insert functions stay short.','ಪ್ರತಿ ಹೊಸ node ಗೆ ಮೆಮೊರಿ ಬೇಕು. malloc heap ನಿಂದ ಮೆಮೊರಿ ಕೊಟ್ಟು ವಿಳಾಸ ಹಿಂತಿರುಗಿಸುತ್ತದೆ; NULL ಆದರೆ (ಮೆಮೊರಿ ಇಲ್ಲ) exit ಮಾಡುತ್ತೇವೆ. createNode() ಇದನ್ನು ಮರೆಮಾಡಿ insert function ಚಿಕ್ಕದಾಗಿರಿಸುತ್ತದೆ.','l'],
['What are NULL and an empty list?','NULL ಮತ್ತು ಖಾಲಿ list ಎಂದರೇನು?','NULL means “points to nothing”. first == NULL means the list is empty. The last node’s link is NULL so a loop knows where to stop.','NULL = “ಯಾವುದನ್ನೂ ತೋರಿಸುವುದಿಲ್ಲ”. first == NULL ಎಂದರೆ list ಖಾಲಿ. ಕೊನೆಯ node ನ link NULL ಆದ್ದರಿಂದ loop ಎಲ್ಲಿ ನಿಲ್ಲಬೇಕೆಂದು ತಿಳಿಯುತ್ತದೆ.','l'],
['What does -> mean?','-> ಎಂದರೇನು?','p->info means “go to the node p points to and read its info”. Use -> with pointers (temp->info) and . with plain structs (q.front).','p->info = “p ತೋರಿಸುವ node ಗೆ ಹೋಗಿ ಅದರ info ಓದು”. pointer ಗೆ -> (temp->info), ಸಾಮಾನ್ಯ struct ಗೆ . (q.front).'],
['Why do functions return first?','Function ಗಳು first ಅನ್ನು ಏಕೆ return ಮಾಡುತ್ತವೆ?','C passes a copy of first to the function. Changing the copy does not change main’s first. So the function returns the new first and main stores it: first = insert_front(item, first);','C ನಲ್ಲಿ function ಗೆ first ನ ನಕಲು ಹೋಗುತ್ತದೆ. ನಕಲು ಬದಲಿಸಿದರೆ main ನ first ಬದಲಾಗುವುದಿಲ್ಲ. ಆದ್ದರಿಂದ ಹೊಸ first ಅನ್ನು return ಮಾಡಿ main ನಲ್ಲಿ first = insert_front(item, first); ಎಂದು ಸಂಗ್ರಹಿಸುತ್ತೇವೆ.','l'],
['Why check the empty list first?','ಮೊದಲು ಖಾಲಿ list ಏಕೆ ಪರೀಕ್ಷಿಸಬೇಕು?','first->info or first->link on an empty list uses NULL and crashes (segmentation fault). Always test first == NULL before touching a node.','ಖಾಲಿ list ನಲ್ಲಿ first->info ಅಥವಾ first->link ಬಳಸಿದರೆ NULL ಬಳಕೆಯಾಗಿ ಪ್ರೋಗ್ರಾಂ crash ಆಗುತ್ತದೆ. Node ಮುಟ್ಟುವ ಮೊದಲು ಯಾವಾಗಲೂ first == NULL ಪರೀಕ್ಷಿಸಿ.','l'],
['Why does the order of two link lines matter?','ಎರಡು link ಸಾಲುಗಳ ಕ್ರಮ ಏಕೆ ಮುಖ್ಯ?','Connect the new node forward first (temp->link = first), then change the old pointer (first = temp). If you reverse them you lose the rest of the list.','ಮೊದಲು ಹೊಸ node ಅನ್ನು ಮುಂದಕ್ಕೆ ಜೋಡಿಸಿ (temp->link = first), ನಂತರ ಹಳೆಯ pointer ಬದಲಿಸಿ (first = temp). ಕ್ರಮ ಉಲ್ಟಾ ಮಾಡಿದರೆ ಉಳಿದ list ಕಳೆದುಹೋಗುತ್ತದೆ.','l'],
['Why cur and prev?','cur ಮತ್ತು prev ಏಕೆ?','cur walks the list. A singly list cannot go backwards, so prev remembers the node behind cur. It is needed to delete the last node or a node in the middle.','cur list ನಲ್ಲಿ ಸಂಚರಿಸುತ್ತದೆ. Singly list ನಲ್ಲಿ ಹಿಂದೆ ಹೋಗಲಾಗದ ಕಾರಣ cur ನ ಹಿಂದಿನ node ಅನ್ನು prev ನೆನಪಿಡುತ್ತದೆ. ಕೊನೆಯ ಅಥವಾ ನಡುವಿನ node ಅಳಿಸಲು ಇದು ಬೇಕು.','l'],
['Why free()?','free() ಏಕೆ?','A deleted node still occupies memory. free(node) gives it back. Print its info before free, because afterwards the data is gone. Forgetting free is a memory leak.','ಅಳಿಸಿದ node ಇನ್ನೂ ಮೆಮೊರಿ ಹಿಡಿದಿರುತ್ತದೆ. free(node) ಅದನ್ನು ಹಿಂದಿರುಗಿಸುತ್ತದೆ. free ಮೊದಲು info ಮುದ್ರಿಸಿ; ನಂತರ ಡೇಟಾ ಸಿಗುವುದಿಲ್ಲ. free ಮರೆತರೆ memory leak.','l'],
['Four steps to write any function','ಯಾವುದೇ function ಬರೆಯಲು 4 ಹಂತಗಳು','1) List the cases: empty, one node, many nodes. 2) Draw the list before and after. 3) Write the pointer changes: new node first, old pointers next. 4) Return the new start pointer.','1) ಸಂದರ್ಭ ಪಟ್ಟಿ ಮಾಡಿ: ಖಾಲಿ, ಒಂದೇ node, ಹೆಚ್ಚು node. 2) ಮೊದಲು ಮತ್ತು ನಂತರದ list ಚಿತ್ರ ಬರೆಯಿರಿ. 3) pointer ಬದಲಾವಣೆ ಬರೆಯಿರಿ: ಹೊಸ node ಮೊದಲು, ಹಳೆಯ pointer ನಂತರ. 4) ಹೊಸ start pointer return ಮಾಡಿ.','l'],
['Circular, doubly and header: what changes?','Circular, doubly, header: ಏನು ಬದಲಾಗುತ್ತದೆ?','Circular: loops stop when you are back at the start (first, last or head), not at NULL. Doubly: every insert or delete fixes two links (llink and rlink) of each neighbour. Header: a data-less head node, so the front never needs a special case.','Circular: loop NULL ನಲ್ಲಿ ಅಲ್ಲ, ಆರಂಭಕ್ಕೆ (first, last ಅಥವಾ head) ಮರಳಿದಾಗ ನಿಲ್ಲುತ್ತದೆ. Doubly: ಪ್ರತಿ insert/delete ನಲ್ಲಿ ನೆರೆಯವರ ಎರಡು link (llink, rlink) ಸರಿಪಡಿಸಿ. Header: ಡೇಟಾ ಇಲ್ಲದ head node, ಆದ್ದರಿಂದ ಮುಂಭಾಗಕ್ಕೆ ವಿಶೇಷ ಸಂದರ್ಭ ಬೇಡ.','x'],
['Queue in an array: the key ideas','Array queue: ಮುಖ್ಯ ಅಂಶಗಳು','front is where we delete, rear is where we insert. Check overflow (full) before insert and underflow (empty) before delete. In the circular queue the index wraps with % MAX, and count tells full (count == MAX) or empty (count == 0).','front ನಲ್ಲಿ ಅಳಿಸುತ್ತೇವೆ, rear ನಲ್ಲಿ ಸೇರಿಸುತ್ತೇವೆ. Insert ಮೊದಲು overflow (ತುಂಬಿದೆ), delete ಮೊದಲು underflow (ಖಾಲಿ) ಪರೀಕ್ಷಿಸಿ. Circular queue ನಲ್ಲಿ index % MAX ನಿಂದ ಸುತ್ತುತ್ತದೆ; count == MAX ತುಂಬಿದೆ, count == 0 ಖಾಲಿ.','q']];
const CM={
iF:['Writing first = temp before temp->link = first (the old list is lost). Forgetting return temp.','temp->link = first ಮೊದಲು first = temp ಬರೆಯುವುದು (ಹಳೆಯ list ಕಳೆಯುತ್ತದೆ). return temp ಮರೆಯುವುದು.'],
iE:['Not handling the empty list (cur is NULL, then cur->link crashes). Looping while cur != NULL instead of cur->link != NULL.','ಖಾಲಿ list ನಿಭಾಯಿಸದಿರುವುದು (cur NULL ಆಗಿ cur->link crash). cur->link != NULL ಬದಲು cur != NULL ವರೆಗೆ loop ಮಾಡುವುದು.'],
dF:['Calling free(first) and then using first->info or first->link. Not checking first == NULL.','free(first) ನಂತರ first->info ಅಥವಾ first->link ಬಳಸುವುದು. first == NULL ಪರೀಕ್ಷಿಸದಿರುವುದು.'],
dE:['Forgetting the one-node case (prev stays NULL and prev->link crashes). Forgetting prev->link = NULL.','ಒಂದೇ node ಸಂದರ್ಭ ಮರೆಯುವುದು (prev NULL ಆಗಿ prev->link crash). prev->link = NULL ಮರೆಯುವುದು.'],
iR:['Changing cur->link before temp->link = cur->link (the rest of the list is lost). Not checking that the key was found.','temp->link = cur->link ಮೊದಲು cur->link ಬದಲಿಸುವುದು (ಉಳಿದ list ಕಳೆಯುತ್ತದೆ). key ಸಿಕ್ಕಿದೆಯೇ ಪರೀಕ್ಷಿಸದಿರುವುದು.'],
dR:['Not checking cur->link == NULL (nothing to delete on the right). Forgetting free(temp).','cur->link == NULL ಪರೀಕ್ಷಿಸದಿರುವುದು (ಬಲಕ್ಕೆ ಅಳಿಸಲು ಏನೂ ಇಲ್ಲ). free(temp) ಮರೆಯುವುದು.'],
dsp:['Moving first itself instead of cur (the list is lost). Forgetting cur = cur->link (infinite loop).','cur ಬದಲು first ಅನ್ನೇ ಸರಿಸುವುದು (list ಕಳೆಯುತ್ತದೆ). cur = cur->link ಮರೆಯುವುದು (ಅನಂತ loop).'],
rev:['Not saving temp = first->link before changing first->link.','first->link ಬದಲಿಸುವ ಮೊದಲು temp = first->link ಉಳಿಸದಿರುವುದು.'],
qi:['Not checking overflow before storing; forgetting % MAX in the circular queue.','ಸಂಗ್ರಹಿಸುವ ಮೊದಲು overflow ಪರೀಕ್ಷಿಸದಿರುವುದು; circular queue ನಲ್ಲಿ % MAX ಮರೆಯುವುದು.'],
qd:['Not checking underflow; forgetting count-- in the circular queue.','underflow ಪರೀಕ್ಷಿಸದಿರುವುದು; circular queue ನಲ್ಲಿ count-- ಮರೆಯುವುದು.']};
const RUL=[
[/^(NODE|void|int) \w+\(.*\)$/,'Function header: its name, what it receives and what it returns. List functions receive the start pointer and return the new start pointer.','Function header: ಹೆಸರು, ಪಡೆಯುವುದು ಮತ್ತು ಹಿಂತಿರುಗಿಸುವುದು. List function ಗಳು start pointer ಪಡೆದು ಹೊಸ start pointer return ಮಾಡುತ್ತವೆ.'],
[/^(NODE|int|char|struct queue) [\w, *]+;$/,'Local helper variables of this function (temp = new or removed node, cur = walker, prev = one behind cur).','ಈ function ನ ಸಹಾಯಕ variable ಗಳು (temp = ಹೊಸ/ತೆಗೆಯುವ node, cur = ಸಂಚರಿಸುವುದು, prev = cur ನ ಹಿಂದಿನದು).'],
[/^int \w+ = 0;$/,'A counter that starts at 0.','0 ಇಂದ ಆರಂಭವಾಗುವ counter.'],
[/^(\w+) = createNode\(\);$/,'Ask malloc (through createNode) for a new node; $1 holds its address.','malloc (createNode ಮೂಲಕ) ನಿಂದ ಹೊಸ node ಪಡೆಯಿರಿ; $1 ಅದರ ವಿಳಾಸ ಹಿಡಿಯುತ್ತದೆ.'],
[/^(\w+)->info = item;$/,'Store the data (item) in the info part of $1.','$1 ನ info ಭಾಗದಲ್ಲಿ ಡೇಟಾ (item) ಇಡಿ.'],
[/^(\w+)->llink = \1->rlink = (\w+);$/,'The new node has no neighbours yet: llink and rlink both become $2 (NULL, or itself/head in a circular list).','ಹೊಸ node ಗೆ ಇನ್ನೂ ನೆರೆಯ node ಇಲ್ಲ: llink ಮತ್ತು rlink ಎರಡೂ $2 ಆಗುತ್ತವೆ (NULL, ಅಥವಾ circular ನಲ್ಲಿ ತನಗೇ / head ಗೆ).'],
[/^(\w+)->(link|rlink) = NULL;$/,'$1 will be the last node, so its $2 is NULL: nothing comes after it.','$1 ಕೊನೆಯ node ಆಗುವುದರಿಂದ ಅದರ $2 NULL: ಅದರ ನಂತರ ಏನೂ ಇಲ್ಲ.'],
[/^if \((\w+) == NULL\)$/,'Case: is the list empty? $1 == NULL means there is no node at all.','ಸಂದರ್ಭ: list ಖಾಲಿಯೇ? $1 == NULL ಎಂದರೆ ಒಂದೂ node ಇಲ್ಲ.'],
[/^if \((\w+)->(link|rlink) == NULL\)$/,'Case: only one node? Its $2 is NULL, so nothing follows it.','ಸಂದರ್ಭ: ಒಂದೇ node ಇದೆಯೇ? ಅದರ $2 NULL, ಅಂದರೆ ಅದರ ನಂತರ ಏನೂ ಇಲ್ಲ.'],
[/^if \((\w+)->(link|rlink) == (\w+)\)$/,'Is there only one node? Its $2 comes straight back to $3 (itself or head).','ಒಂದೇ node ಇದೆಯೇ? ಅದರ $2 ನೇರವಾಗಿ $3 ಗೆ (ತನಗೇ ಅಥವಾ head ಗೆ) ಮರಳುತ್ತದೆ.'],
[/^if \(cur == (NULL|head)\)$/,'Key not found: cur ran past the list.','Key ಸಿಗಲಿಲ್ಲ: cur list ದಾಟಿ ಹೋಯಿತು.'],
[/^if \(cur->info != key\)$/,'Key not found: the walk ended without meeting a node whose info is key.','Key ಸಿಗಲಿಲ್ಲ: info = key ಇರುವ node ಸಿಗದೆ ಸಂಚಾರ ಮುಗಿಯಿತು.'],
[/^if \(cur == (NULL|head) \|\| cur->(link|rlink) == (NULL|head)\)$/,'Nothing to delete on the right: the key is missing or cur is the last node.','ಬಲಕ್ಕೆ ಅಳಿಸಲು ಏನೂ ಇಲ್ಲ: key ಇಲ್ಲ ಅಥವಾ cur ಕೊನೆಯ node.'],
[/^if \(cur->info != key \|\|.*\)$/,'Key missing, or cur is the only node: the node on its right cannot be deleted.','Key ಇಲ್ಲ, ಅಥವಾ cur ಒಂದೇ node: ಅದರ ಬಲದ node ಅಳಿಸಲಾಗದು.'],
[/^if \(temp == (\w+)\)$/,'Is the removed node also $1? Then $1 must be moved as well.','ತೆಗೆಯುವ node $1 ಕೂಡ ಆಗಿದೆಯೇ? ಹಾಗಿದ್ದರೆ $1 ಅನ್ನೂ ಸರಿಸಬೇಕು.'],
[/^if \((.+)\)$/,'Check this condition: $1','ಈ ಷರತ್ತು ಪರೀಕ್ಷಿಸಿ: $1'],
[/^else$/,'Otherwise (the other case).','ಇಲ್ಲದಿದ್ದರೆ (ಇನ್ನೊಂದು ಸಂದರ್ಭ).'],
[/^cur = (first|head|last->link|head->link|head->rlink);$/,'Start walking: cur begins at $1.','ಸಂಚಾರ ಶುರು: cur $1 ನಿಂದ ಆರಂಭ.'],
[/^(\w+) = \1->(link|rlink);$/,'Move $1 one node ahead (follow its $2).','$1 ಅನ್ನು ಒಂದು node ಮುಂದೆ ಸರಿಸಿ ($2 ಅನುಸರಿಸಿ).'],
[/^prev = cur;$/,'prev remembers the node cur is about to leave (one step behind).','cur ಬಿಟ್ಟುಹೋಗುವ node ಅನ್ನು prev ನೆನಪಿಡುತ್ತದೆ (ಒಂದು ಹೆಜ್ಜೆ ಹಿಂದೆ).'],
[/^prev = NULL;$/,'prev starts as NULL: nothing is behind the first node.','prev NULL ನಿಂದ ಶುರು: ಮೊದಲ node ನ ಹಿಂದೆ ಏನೂ ಇಲ್ಲ.'],
[/^prev = head;$/,'prev starts at the header, one step behind cur.','prev header ನಿಂದ ಶುರು, cur ಗಿಂತ ಒಂದು ಹೆಜ್ಜೆ ಹಿಂದೆ.'],
[/^temp = first;$/,'Remember the first node in temp so it can be freed later.','ಮೊದಲ node ಅನ್ನು temp ನಲ್ಲಿ ನೆನಪಿಡಿ, ನಂತರ free ಮಾಡಲು.'],
[/^temp = cur->(link|rlink);$/,'temp = the node on the right of cur: the one to delete.','temp = cur ನ ಬಲದ node: ಅಳಿಸಬೇಕಾದದ್ದು.'],
[/^temp = first->link;$/,'Save the rest of the list in temp before the link is changed.','link ಬದಲಿಸುವ ಮೊದಲು ಉಳಿದ list ಅನ್ನು temp ನಲ್ಲಿ ಉಳಿಸಿ.'],
[/^(\w+) = (\w+)->(link|rlink|llink);$/,'$1 now points to the node that $2 reaches through $3.','$1 ಈಗ $2 ಯಾವ node ಗೆ $3 ಮೂಲಕ ತಲುಪುತ್ತದೋ ಅದನ್ನು ತೋರಿಸುತ್ತದೆ.'],
[/^(\w+) = (\w+);$/,'$1 now points to the same node as $2.','$1 ಈಗ $2 ತೋರಿಸುವ node ಅನ್ನೇ ತೋರಿಸುತ್ತದೆ.'],
[/^(\w+)->(link|rlink) = temp->\2;$/,'Skip over temp: $1 now links to the node after temp.','$1 ಈಗ temp ನ ನಂತರದ node ಗೆ ಜೋಡಿಸಿದೆ: temp ಅನ್ನು ಬಿಟ್ಟುಹೋಗಿ.'],
[/^temp->(link|rlink) = (\w+)->\1;$/,'The new node takes over what $2 pointed to, so the rest of the list stays connected. Do this BEFORE changing $2.','ಹೊಸ node $2 ತೋರಿಸುತ್ತಿದ್ದದ್ದನ್ನೇ ತೋರಿಸುತ್ತದೆ, ಆದ್ದರಿಂದ ಉಳಿದ list ಜೋಡಣೆಯಲ್ಲೇ ಇರುತ್ತದೆ. $2 ಬದಲಿಸುವ ಮೊದಲು ಇದನ್ನು ಮಾಡಿ.'],
[/^temp->(link|rlink) = (first|head->link|last->link|head);$/,'Connect the new node forward to the old first node so the old list is not lost.','ಹೊಸ node ಅನ್ನು ಹಳೆಯ ಮೊದಲ node ಗೆ ಮುಂದಕ್ಕೆ ಜೋಡಿಸಿ, ಇದರಿಂದ ಹಳೆಯ list ಕಳೆದುಹೋಗುವುದಿಲ್ಲ.'],
[/^(\w+)->(link|rlink) = (\w+)->\2;$/,'Bypass: $1 now links to whatever $3 linked to, so the node in between is skipped.','$1 ಈಗ $3 ಯಾವುದಕ್ಕೆ ಜೋಡಿಸಿತ್ತೋ ಅದಕ್ಕೆ ಜೋಡಿಸಿದೆ: ನಡುವಿನ node ಅನ್ನು ಬಿಟ್ಟುಹೋಗಿ.'],
[/^(\w+)->(link|rlink) = temp;$/,'Connect the existing node $1 to the new node temp.','ಈಗಿರುವ node $1 ಅನ್ನು ಹೊಸ node temp ಗೆ ಜೋಡಿಸಿ.'],
[/^(\w+)->llink = (\w+);$/,'Fix the back link: $1’s llink = $2, so both directions agree.','ಹಿಂದಿನ link ಸರಿಪಡಿಸಿ: $1 ನ llink = $2, ಎರಡೂ ದಿಕ್ಕು ಹೊಂದಿಕೆಯಾಗಲು.'],
[/^q->data\[q->rear\] = (\w+);$/,'Store $1 in the cell that rear points to.','rear ತೋರಿಸುವ ಕೋಶದಲ್ಲಿ $1 ಇಡಿ.'],
[/^q->rear = \(q->rear \+ 1\) % MAX;$/,'Move rear one cell ahead; % MAX wraps it to 0 after the last cell (circular).','rear ಅನ್ನು ಒಂದು ಕೋಶ ಮುಂದೆ ಸರಿಸಿ; % MAX ಕೊನೆಯ ಕೋಶದ ನಂತರ 0 ಗೆ ಸುತ್ತಿಸುತ್ತದೆ (circular).'],
[/^q->front = \(q->front \+ 1\) % MAX;$/,'Move front one cell ahead (wrapping with % MAX).','front ಅನ್ನು ಒಂದು ಕೋಶ ಮುಂದೆ ಸರಿಸಿ (% MAX ಸುತ್ತುತ್ತದೆ).'],
[/^q->rear = q->rear \+ 1;$/,'Move rear one cell ahead.','rear ಅನ್ನು ಒಂದು ಕೋಶ ಮುಂದೆ ಸರಿಸಿ.'],
[/^q->front = q->front \+ 1;$/,'Move front one cell ahead.','front ಅನ್ನು ಒಂದು ಕೋಶ ಮುಂದೆ ಸರಿಸಿ.'],
[/^q->count\+\+;$/,'One more element in the queue.','queue ನಲ್ಲಿ ಒಂದು ಅಂಶ ಹೆಚ್ಚು.'],
[/^q->count--;$/,'One element less in the queue.','queue ನಲ್ಲಿ ಒಂದು ಅಂಶ ಕಡಿಮೆ.'],
[/^f = \(f \+ 1\) % MAX;$/,'Next cell (wraps around).','ಮುಂದಿನ ಕೋಶ (ಸುತ್ತುತ್ತದೆ).'],
[/^f = q->front;$/,'f walks from the front.','f front ನಿಂದ ಸಂಚರಿಸುತ್ತದೆ.'],
[/^(\w+)->(\w+)->(\w+) = (\w+);$/,'Fix the neighbour: go through $1->$2 and set its $3 to $4.','ನೆರೆಯವರನ್ನು ಸರಿಪಡಿಸಿ: $1->$2 ಮೂಲಕ ಹೋಗಿ ಅದರ $3 ಅನ್ನು $4 ಮಾಡಿ.'],
[/^(\w+)->(\w+) = (\w+);$/,'Rewire: $1’s $2 now points to $3.','ಮರುಜೋಡಣೆ: $1 ನ $2 ಈಗ $3 ಅನ್ನು ತೋರಿಸುತ್ತದೆ.'],
[/^return NULL;$/,'Return NULL: the list is empty now (or there was nothing to do).','NULL return: list ಈಗ ಖಾಲಿ (ಅಥವಾ ಮಾಡಲು ಏನೂ ಇರಲಿಲ್ಲ).'],
[/^return temp;$/,'Return temp: when inserting at the front (or into an empty list) the new node becomes the new first.','temp return: ಮುಂದೆ (ಅಥವಾ ಖಾಲಿ list ಗೆ) ಸೇರಿಸಿದಾಗ ಹೊಸ node ಹೊಸ first ಆಗುತ್ತದೆ.'],
[/^return (first|last|head|second|prev|cur|sec);$/,'Return $1: the start pointer after this operation. main stores it.','$1 return: ಈ operation ನಂತರದ start pointer. main ಅದನ್ನು ಸಂಗ್ರಹಿಸುತ್ತದೆ.'],
[/^return (\d+|ecount);$/,'Return the counted value.','ಎಣಿಸಿದ ಮೌಲ್ಯ return.'],
[/^return;$/,'Stop the function here (it returns nothing).','function ಇಲ್ಲಿಗೇ ನಿಲ್ಲುತ್ತದೆ (ಏನನ್ನೂ ಹಿಂತಿರುಗಿಸುವುದಿಲ್ಲ).'],

 const bad=(/\bitem\b/.test(tx)&&!/char|%c/.test(tx)&&!/scanf\("%d", &item/.test(tx)&&isNaN(inp.item))||(/\bkey\b/.test(tx)&&isNaN(inp.key))||(/\bpos\b/.test(tx)&&isNaN(inp.pos))||(/scanf\("%d", &item/.test(tx)&&isNaN(inp.item));
 if(bad){$('msg').textContent=L(T.nn);return}
 if(['iF','iE','iR','place','iP'].includes(op)&&nodeCount()>=7){$('msg').textContent=L(T.lim);return}
 cop=op;
 if(op=='cr'){G=mkG([]);let all=[];for(const x of[10,20,30]){const r=exec('iF',{...inp,item:x},G);G=r.G;all=all.concat(r.steps.filter(s=>!s.done))}const r=exec('dsp',inp,G);st=all.concat([r.steps[r.steps.length-1]]);st[st.length-1].ln=-1}
 else{const r=exec(op,inp,G);st=r.steps;G=r.G}
 ix=0;render()}
function step(x){stop();ix=Math.max(0,Math.min(st.length-1,ix+x));render()}
function runAll(){stop();if(st.length){ix=st.length-1;render()}}
function play(){if(tm)return stop();if(!st.length)return;if(ix>=st.length-1)ix=0;tm=setInterval(()=>{if(ix>=st.length-1)return stop();ix++;render()},1100);render()}
function stop(){if(tm){clearInterval(tm);tm=null;$('pl').textContent=L(T.auto)}}
function cp(){const t=d.lines.map(l=>l.t).join('\n'),ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();$('msg').textContent=L(ok?T.cpd:T.cpf)}
function game(){const fk=cop?OPS[cop].f:d.keys[0],ls=d.lines.filter(l=>l.fn==fk&&l.t.trim()&&!/^[{}]$/.test(l.t.trim()));gm={e:ls,i:0,u:[],b:[],o:ls.map((_,i)=>i).sort(()=>Math.random()-.5)};dg()}
function dg(m){const g=gm;$('gm').hidden=false;$('gm').innerHTML=`<b>🎮 ${esc(g.e[0].t.trim())}</b><div class="mu">${L(T.gt)}</div><pre style="max-height:none">${g.b.map(i=>`<div>${esc(g.e[i].t)}</div>`).join('')||'<div> </div>'}</pre>`+(g.i==g.e.length?`<div id="msg">${L(T.gd)}</div>`:(m?`<div class="mu" style="color:var(--cur)">${L(T.gw)}</div>`:'')+g.o.filter(i=>!g.u.includes(i)).map(i=>`<button class="gb" onclick="pick(${i})">${esc(g.e[i].t.trim())}</button>`).join(''))}
function pick(i){const g=gm;if(g.e[i].t.trim()==g.e[g.i].t.trim()){g.u.push(i);g.b.push(g.i);g.i++;dg()}else dg(1)}
$('hc').onchange=render;sel('l7');
